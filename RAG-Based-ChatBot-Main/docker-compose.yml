version: "3.8"

services:
  # ==========================================
  # 1. FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuchat_backend
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_BASE_URL=http://host.docker.internal:11434
      - DOCLING_URL=http://docling:5001
      - DATABASE_URL=postgresql+asyncpg://raguser:ragpassword@postgres:5432/ragdb
    volumes:
      - backend_uploads:/app/backend/data/uploads
      - backend_converted:/app/backend/data/converted
      - backend_bm25:/app/backend/data/bm25
      - model_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - docling
      - postgres
      - redis
    restart: unless-stopped

  # ==========================================
  # 2. Frontend React Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: docuchat_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # 3. Vector Database (Qdrant)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docuchat_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ==========================================
  # 4. Docling Document Conversion Service
  # ==========================================
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docuchat_docling
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ==========================================
  # 5. Local LLM Service (Ollama with Qwen)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: docuchat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # ========================================================
    # GPU Acceleration (Uncomment below if NVIDIA GPU is present):
    # ========================================================
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  # ==========================================
  # 6. Relational Database (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: docuchat_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # 7. Caching & Message Broker (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: docuchat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_converted:
  backend_bm25:
  model_cache:
