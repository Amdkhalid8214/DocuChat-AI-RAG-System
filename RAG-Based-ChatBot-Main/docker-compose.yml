name: gitrag

services:
  # ==========================================
  # 1. FastAPI Backend Service
  # ==========================================
  backend:
    image: gitrag-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuchat_backend
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:1.5b
      - LLM_TEMPERATURE=0.0
      - LLM_MAX_TOKENS=512
      - LLM_NUM_THREADS=2
      - LLM_NUM_CTX=2048
      - DOCLING_URL=http://docling:5001
      - DATABASE_URL=postgresql+asyncpg://raguser:ragpassword@postgres:5432/ragdb
      - REDIS_URL=redis://redis:6379/0
      - SEARXNG_URL=http://host.docker.internal:8080
    volumes:
      - ./backend:/app/backend
      - backend_uploads:/app/backend/data/uploads
      - backend_converted:/app/backend/data/converted
      - backend_bm25:/app/backend/data/bm25
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      docling:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # 2. Ingestion Worker Service (Background Jobs)
  # ==========================================
  worker:
    image: gitrag-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuchat_worker
    healthcheck:
      disable: true
    command: ["python", "-m", "backend.workers.ingest_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://raguser:ragpassword@postgres:5432/ragdb
      - QDRANT_URL=http://qdrant:6333
      - DOCLING_URL=http://docling:5001
      - OLLAMA_URL=http://ollama:11434
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:1.5b
      - LLM_MAX_TOKENS=512
      - LLM_NUM_THREADS=2
      - LLM_NUM_CTX=2048
    volumes:
      - ./backend:/app/backend
      - backend_uploads:/app/backend/data/uploads
      - backend_converted:/app/backend/data/converted
      - backend_bm25:/app/backend/data/bm25
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ==========================================
  # 3. Frontend React Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: docuchat_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================
  # 4. Vector Database (Qdrant)
  # ==========================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: docuchat_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ==========================================
  # 5. Docling Document Conversion Service
  # ==========================================
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docuchat_docling
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ==========================================
  # 6. Local LLM Service (Ollama with Qwen)
  # ==========================================
  ollama:
    image: ollama/ollama:latest
    container_name: docuchat_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped


  # ==========================================
  # 7. Relational Database (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: docuchat_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # 8. Caching & Message Broker (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: docuchat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_converted:
  backend_bm25:
  model_cache:

